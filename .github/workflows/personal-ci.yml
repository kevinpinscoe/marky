# CI for the `personal` branch only.
#
# This file is deliberately separate from the upstream `test.yml` rather than an
# edit to it. `test.yml` travels back to marky-editor/marky in pull requests, so
# adding `personal` to its branch list would create a conflict on every future
# upstream sync. A personal-only file has zero conflict surface.
#
# It also covers two checks `test.yml` never runs — lint and typecheck. Those
# only ever ran in the Husky pre-commit hook, which exits 0 immediately on
# `personal` (see CLAUDE.md → Git hooks), so nothing checked them on this branch.
#
# Actions are SHA-pinned per ~/ai/directives/when-generating-code-or-updating-code-in-an-outside-repo.md
name: Personal CI

on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal]
  workflow_dispatch:

permissions:
  contents: read

# A force-push to `personal` is routine here; don't leave superseded runs going.
concurrency:
  group: personal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Expect 0 errors. Two warnings in i18n-context.tsx are known and upstream.
      - run: npm run lint

      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Mandatory: the e2e fixture launches whatever is already in out/ and never
      # rebuilds it. Dropping this step reintroduces the stale-out/ trap that
      # failed all 16 accessibility tests locally (see RUNBOOK.md step 5).
      - run: npm run build

      - run: npx playwright install-deps

      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx playwright test
        env:
          CI: true
