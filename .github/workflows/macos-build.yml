name: macOS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --mac dmg --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: marky-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Create release and upload assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

      # Publishes a Homebrew Cask to kevinpinscoe/homebrew-tap, mirroring the
      # layout used by other desktop-app casks in that tap (see vermilian).
      # Requires a HOMEBREW_TAP_TOKEN secret on this repo: a fine-grained PAT
      # scoped to kevinpinscoe/homebrew-tap with Contents read/write.
      - name: Update Homebrew tap cask
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARM_DMG=$(cd dist && ls Marky-*-arm64.dmg | head -1)
          INTEL_DMG=$(cd dist && ls Marky-*.dmg | grep -v -- -arm64.dmg | head -1)
          ARM_SHA=$(shasum -a 256 "dist/$ARM_DMG" | awk '{print $1}')
          INTEL_SHA=$(shasum -a 256 "dist/$INTEL_DMG" | awk '{print $1}')
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/kevinpinscoe/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/marky.rb <<EOF
          # This file was generated by .github/workflows/macos-build.yml in
          # kevinpinscoe/marky. DO NOT EDIT.
          cask "marky" do
            version "${VERSION}"

            on_macos do
              on_arm do
                sha256 "${ARM_SHA}"
                url "${BASE}/${ARM_DMG}"
              end
              on_intel do
                sha256 "${INTEL_SHA}"
                url "${BASE}/${INTEL_DMG}"
              end
            end

            name "Marky"
            desc "Open source desktop Markdown editor"
            homepage "https://github.com/kevinpinscoe/marky"

            # Unsigned build — remove the quarantine attribute so Gatekeeper allows launch.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/Marky.app"],
                             sudo: false
            end

            app "Marky.app"

            zap trash: [
              "~/Library/Application Support/Marky",
              "~/Library/Preferences/com.marky.app.plist",
              "~/Library/Saved Application State/com.marky.app.savedState",
            ]
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/marky.rb
          git diff --cached --quiet || git commit -m "marky ${GITHUB_REF_NAME}"
          git push
