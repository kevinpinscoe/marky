name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx playwright install-deps

      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx playwright test
        env:
          CI: true

  # Screenshot baselines are captured on Linux because that is what e2e-tests
  # runs on, and font rendering does not carry across platforms. Run this
  # manually after an intentional design change, then commit the artifact.
  update-screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx playwright install-deps

      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx playwright test tests/e2e/screenshots.test.ts --update-snapshots
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines
          path: tests/e2e/screenshots.test.ts-snapshots/
          if-no-files-found: error
